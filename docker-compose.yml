# Compose variables are read from the sibling .env file (see .env.example).
# Everything here is namespaced so CodeAssist stays isolated from other
# projects/containers: own network, own named data volume, fixed port mapping.
services:
  codeassist:
    build: .
    container_name: ${CONTAINER_NAME}
    # Host:container port mapping. Keep HOST_PORT == SERVER_PORT so the
    # healthcheck below targets the port uvicorn actually binds to.
    ports:
      - "${HOST_PORT}:${SERVER_PORT}"
    volumes:
      # Project root as the workspace (shipped skills/tools resolve under
      # <workspace>/codeassist/... and runtime/ content is written here).
      - ${WORKSPACE}:/workspace
      # Persist the SQLite DB + session history across container recreation.
      # Config itself is NOT host-mounted on purpose: it comes from the baked-in
      # config.docker.toml default, env vars (WORKSPACE/SERVER_PORT), and UI
      # settings persisted in the DB. This avoids Docker's bind-mount trap of
      # creating an empty ./config.toml directory when the file is absent.
      - ${DATA_VOLUME}:/app/data
      # GitHub CLI / git auth config lives on the host, never in the image.
      # Defaults to $HOME/.codeassist/auth (USERPROFILE on Windows) and survives
      # container recreations and image rebuilds. No credentials are baked in.
      # SSH keys/known_hosts for the remote test VM go in <AUTH_DIR>/ssh and are
      # visible in the container at /auth/ssh (key file must be chmod 600).
      - ${AUTH_DIR:-${HOME:-${USERPROFILE}}/.codeassist/auth}:/auth
    environment:
      - CODEASSIST_WORKSPACE=/workspace
      - CODEASSIST_DATA_DIR=/app/data
      # Keep gh/git config in the mounted host dir instead of the container's
      # ephemeral /root so `gh auth login` persists across container recreation.
      - GH_CONFIG_DIR=/auth/gh
      - GIT_CONFIG_GLOBAL=/auth/gitconfig
      - SERVER_PORT=${SERVER_PORT}
      # Remote test VM (SSH). Empty values are ignored by Config.load(), so a
      # TOML endpoint stays authoritative unless a variable is actually set.
      - CODEASSIST_REMOTE_TEST_VM_ENABLED=${REMOTE_TEST_VM_ENABLED:-}
      - CODEASSIST_REMOTE_TEST_VM_HOST=${REMOTE_TEST_VM_HOST:-}
      - CODEASSIST_REMOTE_TEST_VM_USER=${REMOTE_TEST_VM_USER:-}
      - CODEASSIST_REMOTE_TEST_VM_PORT=${REMOTE_TEST_VM_PORT:-}
      - CODEASSIST_REMOTE_TEST_VM_REMOTE_DIR=${REMOTE_TEST_VM_REMOTE_DIR:-}
      - CODEASSIST_REMOTE_TEST_VM_KEY_PATH=${REMOTE_TEST_VM_KEY_PATH:-}
      - CODEASSIST_REMOTE_TEST_VM_KNOWN_HOSTS=${REMOTE_TEST_VM_KNOWN_HOSTS:-}
      - CODEASSIST_REMOTE_TEST_VM_PASSWORD=${REMOTE_TEST_VM_PASSWORD:-}
      - CODEASSIST_REMOTE_TEST_VM_SYNC=${REMOTE_TEST_VM_SYNC:-}
      - CODEASSIST_REMOTE_TEST_VM_CONNECT_TIMEOUT=${REMOTE_TEST_VM_CONNECT_TIMEOUT:-}
      - CODEASSIST_REMOTE_TEST_VM_TEST_TIMEOUT=${REMOTE_TEST_VM_TEST_TIMEOUT:-}
      - CODEASSIST_REMOTE_TEST_VM_FALLBACK_TO_LOCAL=${REMOTE_TEST_VM_FALLBACK_TO_LOCAL:-}
      - CODEASSIST_REMOTE_TEST_VM_STRICT_HOST_KEY_CHECKING=${REMOTE_TEST_VM_STRICT_HOST_KEY_CHECKING:-}
      - PLAYWRIGHT_BROWSERS_PATH=/ms-playwright
      - TZ=UTC
    # Let the browser tool reach a dev server running on the Docker host at
    # http://host.docker.internal:<port> (add that host to
    # [browser] allowed_private_hosts in config.docker.toml).
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:${SERVER_PORT}/health"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - codeassist-net

# Named volume keeps session history even if the container is removed.
volumes:
  codeassist-data:
    name: ${DATA_VOLUME}

# Dedicated bridge network isolates CodeAssist from other containers/projects.
networks:
  codeassist-net:
    driver: bridge
