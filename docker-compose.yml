services:
  codeassist:
    build: .
    container_name: codeassist
    ports:
      - "${HOST_PORT:-8090}:${SERVER_PORT:-8090}"
    volumes:
      # Mount your project directory as the workspace
      - ${WORKSPACE:-.}:/workspace
      # Mount config (copy config.docker.toml to config.toml to get started)
      - ./config.toml:/app/config.toml:ro
      # Persist session history across container restarts
      - codeassist-data:/app/data
    environment:
      - CODEASSIST_WORKSPACE=/workspace
      # Put the SQLite DB in the mounted volume so session history survives
      # container recreation (not just in the container's writable layer)
      - CODEASSIST_DATA_DIR=/app/data
      - TZ=UTC
    # /health returns 200 once the app is up. Targets the default port; set
    # SERVER_PORT/config.toml [server] port to match if you override it.
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8090/health"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 15s

    volumes:
  codeassist-data:
