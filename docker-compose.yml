# Compose variables are read from the sibling .env file (see .env.example).
# Everything here is namespaced so CodeAssist stays isolated from other
# projects/containers: own network, own named data volume, fixed port mapping.
services:
  codeassist:
    build: .
    container_name: ${CONTAINER_NAME}
    # Host:container port mapping. Keep HOST_PORT == SERVER_PORT so the
    # healthcheck below targets the port uvicorn actually binds to.
    ports:
      - "${HOST_PORT}:${SERVER_PORT}"
    volumes:
      # Project root as the workspace (shipped skills/tools resolve under
      # <workspace>/codeassist/... and runtime/ content is written here).
      - ${WORKSPACE}:/workspace
      # Persist the SQLite DB + session history across container recreation.
      # Config itself is NOT host-mounted on purpose: it comes from the baked-in
      # config.docker.toml default, env vars (WORKSPACE/SERVER_PORT), and UI
      # settings persisted in the DB. This avoids Docker's bind-mount trap of
      # creating an empty ./config.toml directory when the file is absent.
      - ${DATA_VOLUME}:/app/data
    environment:
      - CODEASSIST_WORKSPACE=/workspace
      - CODEASSIST_DATA_DIR=/app/data
      - SERVER_PORT=${SERVER_PORT}
      - TZ=UTC
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:${SERVER_PORT}/health"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - codeassist-net

# Named volume keeps session history even if the container is removed.
volumes:
  codeassist-data:
    name: ${DATA_VOLUME}

# Dedicated bridge network isolates CodeAssist from other containers/projects.
networks:
  codeassist-net:
    driver: bridge
