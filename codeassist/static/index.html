<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CodeAssist</title>
    <link rel="stylesheet" href="/static/style.css">
    <link rel="stylesheet" href="/static/vendor/github-dark.min.css">
    <script src="/static/vendor/marked.min.js"></script>
    <script src="/static/vendor/highlight.min.js"></script>
</head>
<body>
    <div id="app">
        <aside id="sidebar">
            <div class="sidebar-header">
                <h1>CodeAssist</h1>
                <div class="header-actions">
                    <div class="header-links">
                        <a href="/static/tools.html" class="header-icon" title="Tool Manager">
                            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14.7 6.3a4 4 0 0 0-5.4 5.4L3 18l3 3 6.3-6.3a4 4 0 0 0 5.4-5.4l-2.6 2.6-2-.9.9-.9z"/><path d="M2 22 16 8"/></svg>
                        </a>
                        <a href="/static/admin.html" class="header-icon" title="Admin / Settings">
                            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
                        </a>
                        <a href="/static/kb.html" class="header-icon" title="Knowledge Base">
                            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg>
                        </a>
                        <select id="agent-select" title="Active agent" style="display:none;"></select>
                    </div>
                    <button id="import-btn" class="header-action-btn" title="Import session from JSON"></button>
                    <button id="new-session-btn" class="header-action-btn new-session" title="New Session">+</button>
                </div>
            </div>
            <div id="session-list"></div>
            <div class="sidebar-footer">
                <div class="footer-links">
                    <a href="/static/tools.html" class="kb-link">Tool Manager</a>
                    <a href="/static/admin.html" class="kb-link">Admin</a>
                    <a href="/static/kb.html" class="kb-link">Knowledge Base</a>
                </div>
                <div id="model-info"></div>
                <button id="toggle-thinking-btn" class="footer-toggle" title="Toggle thinking visibility">Show thinking</button>
            </div>
        </aside>
        <main id="chat-area">
            <div id="messages"></div>
            <div id="plan-display"></div>
            <div id="input-area">
                <div id="attach-preview"></div>
                <div id="attach-row">
                    <input type="file" id="file-input" accept="image/png,image/jpeg,image/webp,image/gif,text/*,.txt,.md,.markdown,.py,.js,.jsx,.ts,.tsx,.json,.toml,.yaml,.yml,.csv,.html,.css,.scss,.sql,.sh,.bash,.go,.rs,.java,.c,.cpp,.h,.hpp,.rb,.php,.lua,.xml" multiple hidden>
                    <button id="attach-btn" title="Attach files or images">&#128206;</button>
                    <textarea id="user-input" placeholder="Ask me anything..." rows="1"></textarea>
                    <button id="send-btn" title="Send (Enter)">&#9654;</button>
                    <button id="stop-btn" title="Stop" style="display:none;">&#9632;</button>
                </div>
            </div>
        </main>
    </div>
    <script src="/static/app.js"></script>
</body>
</html>
