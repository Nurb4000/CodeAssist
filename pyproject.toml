[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "codeassist"
version = "1.0.0"
description = "AI coding assistant for local development with MCP, skills, plugins, and LSP support"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.29.0",
    "websockets>=12.0",
    "openai>=1.30.0",
    "aiosqlite>=0.20.0",
    "httpx>=0.27.0",
    "markdown>=3.6",
    "pygments>=2.18.0",
    "wcmatch>=8.5",
    "tiktoken>=0.7.0",
    "duckduckgo-search>=4.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.0.0",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.0.0",
]

[project.scripts]
codeassist = "codeassist.cli:main"

[tool.setuptools.packages.find]
include = ["codeassist*"]

# codeassist/skills/ and codeassist/plugins/ are data directories, not packages
# (no __init__.py), so they are skipped by packages.find. Ship them explicitly or
# an installed copy of CodeAssist discovers zero default skills and has no plugin
# template to copy from. Plugins stay workspace-scoped on purpose (they are
# executable and trust-checked), so the bundled one is a template only.
[tool.setuptools.package-data]
codeassist = ["skills/*.md", "skills/**/*.md", "plugins/*/*.py", "plugins/*/*.json"]
