# Docker-specific config — copy this to config.toml to get started:
#   cp config.docker.toml config.toml

[llm]
# Provider is a required enum; "openai" also works for OpenAI-compatible
# backends (llama.cpp, vLLM) via base_url below.
provider = "openai"

# Model is intentionally left blank: LLM identity is configured in the UI
# (Settings > LLM) and persisted between sessions. Leave empty until set.
model = ""
api_key = ""
base_url = ""

[llm.parameters]
temperature = 0.0
max_tokens = 8192
context_window = 128000

[server]
# Inside Docker, uvicorn binds to 0.0.0.0 (set via entrypoint)
# This value determines the container's listening port
host = "0.0.0.0"
port = 8090
# Workspace is mounted at /workspace inside the container
workspace = "/workspace"

[agent]
max_iterations = 30
name = "CodeAssist"
default_agent = "default"

[tools]
shell_timeout = 120
max_output_chars = 20000
webfetch_max_chars = 30000
websearch_max_chars = 30000
websearch_engine = "duckduckgo"
tool_output_max_tokens = 4000

[mcp]
enabled = false

[skills]
enabled = true
directories = ["codeassist/skills", "runtime/skills"]

[plugins]
enabled = false

[lsp]
enabled = false

[git]
enabled = true
auto_detect = true

[compaction]
enabled = true
threshold_pct = 75
keep_recent = 20
tool_result_max_tokens = 4000

[permissions]
# Tool permission mode. Set from the admin Settings UI (Settings > Permissions >
# Trust all tools) and persisted in the DB; config is the file-based fallback.
#   "ask"      -> prompt for confirmation on every tool call (default)
#   "session"  -> auto-allow all tool calls until the server restarts
#   "always"   -> auto-allow all tool calls, persisted across restarts
trust_all = "ask"
