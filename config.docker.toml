# Docker-specific config — copy this to config.toml to get started:
#   cp config.docker.toml config.toml

[llm]
# Provider is a required enum; "openai" also works for OpenAI-compatible
# backends (llama.cpp, vLLM) via base_url below.
provider = "openai"

# Model is intentionally left blank: LLM identity is configured in the UI
# (Settings > LLM) and persisted between sessions. Leave empty until set.
model = ""
api_key = ""
base_url = ""

# Seconds without LLM output before the request/stream is treated as timed out
# (default 900 = 7.5x the historical 120, for slower hardware). Changeable
# from the admin UI under Settings > LLM.
timeout = 900

[llm.parameters]
temperature = 0.0
max_tokens = 8192
context_window = 128000

[server]
# Inside Docker, uvicorn binds to 0.0.0.0 (set via entrypoint)
# This value determines the container's listening port
host = "0.0.0.0"
port = 8090
# Workspace is mounted at /workspace inside the container
workspace = "/workspace"

[agent]
name = "CodeAssist"
default_agent = "default"

[tools]
shell_timeout = 120
max_output_chars = 20000
webfetch_max_chars = 30000
websearch_max_chars = 30000
websearch_engine = "duckduckgo"
tool_output_max_tokens = 4000

# Remote full VM for code tests (test_runner). config.toml is overwritten at boot
# by this baked-in file (see docker-entrypoint.sh), so this table must live here
# or be set in Settings > Remote Test VM / via CODEASSIST_REMOTE_TEST_VM_* env.
# Empty host = local fallback. Put keys/known_hosts under ${AUTH_DIR}/ssh on the
# host (mounted at /auth/ssh in the container) with mode 0600 on the key.
[remote_test_vm]
enabled = true
host = ""
port = 22
user = ""
remote_dir = "~/codeassist-tests"   # remote user's home; ~ expands on the VM, not locally; avoid /tmp (small tmpfs)
key_path = ""
known_hosts = ""
password = ""
sync = "rsync"
rsync_excludes = [".git", ".venv", "node_modules", "__pycache__", ".pytest_cache", "*.egg-info", "runtime/tool-output"]
connect_timeout = 5
test_timeout = 300
fallback_to_local = true
strict_host_key_checking = true
remote_env = ""

[mcp]
enabled = false

[skills]
enabled = true
directories = ["codeassist/skills", "runtime/skills"]

[plugins]
enabled = false

[lsp]
enabled = false

[git]
enabled = true
auto_detect = true

[compaction]
enabled = true
threshold_pct = 85
keep_recent = 20
tool_result_max_tokens = 4000

[permissions]
# Tool permission mode. Set from the admin Settings UI (Settings > Permissions >
# Trust all tools) and persisted in the DB; config is the file-based fallback.
#   "ask"      -> prompt for confirmation on every tool call (default)
#   "session"  -> auto-allow all tool calls until the server restarts
#   "always"   -> auto-allow all tool calls, persisted across restarts
trust_all = "ask"

[musicgen]
# External ACE-Step synthesis server (musicgen) used by the musicgen tool.
# NOTE: in Docker, config.toml is overwritten at boot by this baked-in file
# (see docker-entrypoint.sh), so the [musicgen] section must live here — or be
# set via Settings > Tools in the admin UI. Changing this file requires a
# rebuild (the image COPYs it in at build time).
host = "10.0.1.27"
port = 3000
timeout_seconds = 9000

[browser]
# Playwright-backed browser automation. In Docker, localhost is the container
# itself; a dev server on the host is reachable at host.docker.internal (see
# docker-compose.yml extra_hosts). Cloud metadata/link-local addresses are never
# allowed. Public URLs are off by default.
enabled = true
headless = true
allow_local = true
allow_public = false
allowed_origins = []
allowed_private_hosts = ["host.docker.internal"]
navigation_timeout_seconds = 45
action_timeout_seconds = 15
idle_timeout_seconds = 900
max_pages = 8
viewport_width = 1280
viewport_height = 800
